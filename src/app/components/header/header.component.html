<header>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid px-2 d-flex justify-content-between align-items-center">
      <!-- Menu Icon (Left) -->
      <button class="btn btn-link text-white p-0 menu-btn" (click)="toggleNav($event)">
        <i class="bi bi-list fs-2"></i>
      </button>

      <!-- Logo Centered -->
      <div class="navbar-brand-center">
        <a routerLink="/" class="navbar-brand logo mb-0 d-flex align-items-center">
          <img src="favicon.ico" alt="Icon" class="logo-img me-2" style="width: 24px; height: 24px;">
          <span class="logo-main">
            <span class="logo-part1">Allfree</span><span class="logo-part2">Jobs</span>
          </span>
        </a>
      </div>

      <!-- Search Icon (Right) -->
      <button class="btn btn-link text-white p-0 search-btn" (click)="toggleSearchModal($event)">
        <i class="bi bi-search fs-4"></i>
      </button>
    </div>
  </nav>

  <!-- Search Modal Overlay -->
  <div class="search-modal-backdrop" *ngIf="isSearchModalOpen" (click)="closeSearchModal()">
    <div class="search-modal-content" (click)="$event.stopPropagation()">
      <div class="p-2 border-bottom bg-light d-flex align-items-center gap-2">
        <div class="input-group input-group-sm flex-grow-1">
          <input type="text" 
                 class="form-control rounded-pill ps-3" 
                 placeholder="Search jobs..." 
                 [(ngModel)]="searchQuery"
                 (ngModelChange)="performSearch()"
                 (keyup.enter)="performSearch()">
        </div>
        <div class="d-flex gap-1 align-items-center">
          <button class="btn btn-link text-muted p-0 ms-1" (click)="closeSearchModal()">
            <i class="bi bi-x-lg fs-5"></i>
          </button>
        </div>
      </div>
      <div class="search-modal-body p-3 text-center" *ngIf="!searchQuery">
        <p class="text-muted small mb-0">Type to search for jobs, categories, or companies.</p>
      </div>
      <div class="search-modal-body p-2" *ngIf="searchQuery && searchResults.length > 0">
        <div class="list-group list-group-flush shadow-sm rounded">
          <button type="button" 
                  *ngFor="let result of searchResults" 
                  (click)="viewJobDetails(result)"
                  class="list-group-item list-group-item-action py-2 px-3 d-flex flex-column border-0 border-bottom">
            <span class="text-dark fw-bold small text-truncate">{{ result.title }}</span>
            <span class="text-muted smaller d-flex justify-content-between">
              <span>{{ result.category || 'Job' }}</span>
              <span class="text-secondary" *ngIf="result.createdDate">{{ result.createdDate | date:'MMM d' }}</span>
            </span>
          </button>
        </div>
      </div>
      <div class="search-modal-body p-4 text-center" *ngIf="searchQuery && searchResults.length === 0">
        <p class="text-muted small mb-0">No matching jobs found.</p>
      </div>
    </div>
  </div>

  <!-- Offcanvas Menu -->
  <div class="mobile-offcanvas" [class.active]="isNavActive">
    <div class="offcanvas-header-nav">
      <span class="text-white fw-bold">AllJobs.com</span>
      <button class="btn-close-custom" (click)="closeNav()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="offcanvas-body p-0">
      <div class="menu-section mt-2">
        <div class="section-label px-3 mb-1">Job Categories</div>
        <div class="menu-items">
          <a *ngFor="let cat of offcanvasFilters"
             [routerLink]="cat.route"
             class="menu-item" 
             routerLinkActive="active"
             (click)="closeNav()">
            <div class="menu-item-icon" [style.background-color]="cat.color + '15'">
              <i class="bi" [ngClass]="cat.icon" [style.color]="cat.color"></i>
            </div>
            <div class="menu-item-content">
              <span class="menu-item-text">{{ cat.name }}</span>
            </div>
            <i class="bi bi-chevron-right ms-auto chevron"></i>
          </a>
        </div>
      </div>

      <div class="menu-section mt-3">
        <div class="section-label px-3 mb-1">Play & Win</div>
        <div class="menu-items">
          <a routerLink="/thambola-game" class="menu-item" (click)="closeNav()">
            <div class="menu-item-icon" style="background-color: #ffeb3b15">
              <i class="bi bi-grid-3x3" style="color: #ffeb3b"></i>
            </div>
            <span class="menu-item-text">Thambola High Five</span>
            <i class="bi bi-chevron-right ms-auto chevron"></i>
          </a>
        </div>
      </div>

    </div>
    <div class="offcanvas-footer">
      <p class="copyright-text mb-0">© 2026 AllJobs. All rights reserved.</p>
    </div>
  </div>
  <div class="offcanvas-overlay" *ngIf="isNavActive" (click)="closeNav()"></div>

  <!-- Category Pills Bar (fixed below navbar) -->
  <div class="pills-bar">
    <div class="pills-scroll-row" style="overflow-x: auto;">
      <a class="jc-pill" routerLink="/" routerLinkActive="jc-pill-active" [routerLinkActiveOptions]="{exact: true}" (click)="closeGamesDropdown()">
        <span>Home</span>
      </a>

      <a class="jc-pill" href="javascript:void(0)"
         *ngFor="let filter of homeFilterOptions"
         [class.jc-pill-active]="selectedHeaderCategory === filter.value"
         (click)="setHeaderCategory(filter.value)">
        <span>{{ filter.label }}</span>
      </a>

      <div class="pill-select-block">
        <select id="jobTypeFilter" class="pill-select" [(ngModel)]="selectedJobTypeFilter" (change)="onJobTypeChange()" aria-label="Select job type">
          <option value="">Job Type</option>
          <option *ngFor="let type of jobTypeOptions" [value]="type.value">{{ type.label }}</option>
        </select>
      </div>

      <div class="pill-select-block">
        <select id="experienceFilter" class="pill-select" [(ngModel)]="selectedExperienceFilter" (change)="onExperienceChange()" aria-label="Select experience">
          <option value="">Experience</option>
          <option *ngFor="let exp of experienceOptions" [value]="exp">{{ exp }}</option>
        </select>
      </div>

      <div class="pill-select-block">
        <select id="educationFilter" class="pill-select" [(ngModel)]="selectedEducationFilter" (change)="onEducationChange()" aria-label="Select education">
          <option value="">Education</option>
          <option *ngFor="let edu of educationOptions" [value]="edu">{{ edu }}</option>
        </select>
      </div>

      <div class="pill-select-block">
        <select id="locationFilter" class="pill-select" [(ngModel)]="selectedLocationFilter" (change)="onLocationChange()" aria-label="Select location">
          <option value="">Location</option>
          <option *ngFor="let city of locationOptions" [value]="city">{{ city }}</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Floating WhatsApp Button (moved from app component) -->
  <div class="floating-wa-btn">
    <button type="button" class="wa-action wa-group-toggle" (click)="joinWhatsAppGroup()" aria-label="Join WhatsApp group">
      <i class="bi bi-whatsapp"></i>
    </button>
    <button type="button" class="wa-action wa-scroll-toggle" (click)="handleScrollDirectionClick()" [attr.aria-label]="showScrollUp ? 'Scroll to top' : 'Scroll down'">
      <i class="bi" [ngClass]="showScrollUp ? 'bi-arrow-up-short' : 'bi-arrow-down-short'"></i>
    </button>
  </div>
</header>
