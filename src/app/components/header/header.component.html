<header class="site-header">
  <div class="site-header-main">
    <div class="header-brand-group">
      <button class="header-icon-button" type="button" (click)="toggleCategories()" aria-label="Browse job categories" [attr.aria-expanded]="categoriesOpen">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <a class="brand" routerLink="/" aria-label="Freejob Information home">
        <span class="brand-wordmark"><strong>Freejob</strong><small>Information</small></span>
      </a>
    </div>
    <div class="header-actions">
      <button class="header-icon-button" type="button" (click)="toggleSearch()" aria-label="Search jobs" [attr.aria-expanded]="searchOpen">
        <i class="bi" [ngClass]="searchOpen ? 'bi-x-lg' : 'bi-search'" aria-hidden="true"></i>
      </button>
      <div *ngIf="!authLoading" class="header-account">
        <ng-container *ngIf="isSignedIn; else loginLink">
          <button class="header-icon-button" type="button" aria-label="Open profile menu" [attr.aria-expanded]="profileOpen" aria-haspopup="menu" (click)="toggleProfile()"><i class="bi bi-person-circle" aria-hidden="true"></i></button>
          <div *ngIf="profileOpen" class="profile-menu" role="menu">
            <div class="profile-menu-email"><span>Signed in as</span><strong>{{ userEmail }}</strong></div>
            <a role="menuitem" routerLink="/login" (click)="closeMenus()"><i class="bi bi-speedometer2" aria-hidden="true"></i>Dashboard</a>
            <button type="button" role="menuitem" (click)="signOutFromHeader()"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Sign out</button>
          </div>
        </ng-container>
        <ng-template #loginLink><a class="header-login-link" routerLink="/login"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i><span>Login</span></a></ng-template>
      </div>
    </div>
  </div>

  <form *ngIf="searchOpen" class="header-search-panel" (ngSubmit)="submitSearch()">
    <label class="visually-hidden" for="header-job-search">Search jobs and companies</label>
    <input id="header-job-search" type="search" name="q" [(ngModel)]="searchQuery" placeholder="Search jobs or companies" autofocus>
    <button type="submit" aria-label="Submit search"><i class="bi bi-search" aria-hidden="true"></i></button>
  </form>

  <button *ngIf="categoriesOpen" class="category-drawer-overlay" type="button" aria-label="Close categories" (click)="closeMenus()"></button>
  <aside class="category-drawer" [class.open]="categoriesOpen" [attr.aria-hidden]="!categoriesOpen">
    <div class="category-drawer-header"><strong>Free job information</strong><button class="header-icon-button" type="button" (click)="closeMenus()" aria-label="Close categories"><i class="bi bi-x-lg"></i></button></div>
    <nav aria-label="Browse jobs and links">
      <a routerLink="/" (click)="closeMenus()"><span class="category-group-name"><i class="bi bi-grid" aria-hidden="true"></i>All latest notifications</span><i class="bi bi-chevron-right" aria-hidden="true"></i></a>
      <button class="category-group-toggle" type="button" [attr.aria-expanded]="governmentOpen" aria-controls="government-job-menu" (click)="governmentOpen = !governmentOpen"><span class="category-group-name"><i class="bi bi-bank" aria-hidden="true"></i>All government jobs</span><i class="bi category-expand-icon" [ngClass]="governmentOpen ? 'bi-dash-lg' : 'bi-plus-lg'" aria-hidden="true"></i></button>
      <div id="government-job-menu" class="category-submenu" *ngIf="governmentOpen">
        <a *ngFor="let category of governmentJobFilters" [routerLink]="['/', categoryRoutePrefix, category.slug]" (click)="closeMenus()">{{ category.label }}</a>
      </div>
      <!--
      <button class="category-group-toggle" type="button" [attr.aria-expanded]="privateOpen" aria-controls="private-job-menu" (click)="privateOpen = !privateOpen"><span class="category-group-name"><i class="bi bi-briefcase" aria-hidden="true"></i>Private jobs</span><i class="bi category-expand-icon" [ngClass]="privateOpen ? 'bi-dash-lg' : 'bi-plus-lg'" aria-hidden="true"></i></button>
      <div id="private-job-menu" class="category-submenu" *ngIf="privateOpen">
        <a [routerLink]="['/', categoryRoutePrefix, 'private-jobs']" (click)="closeMenus()">All private jobs</a>
        <a *ngFor="let category of privateJobFilters" [routerLink]="['/', categoryRoutePrefix, category.slug]" (click)="closeMenus()">{{ category.label }}</a>
        <a *ngFor="let category of privateHiringFilters" [routerLink]="['/', categoryRoutePrefix, category.slug]" (click)="closeMenus()">{{ category.label }}</a>
        <a *ngFor="let category of privateExperienceFilters" [routerLink]="['/', categoryRoutePrefix, category.slug]" (click)="closeMenus()">{{ category.label }}</a>
      </div>
      -->
      <button class="category-group-toggle" type="button" [attr.aria-expanded]="experienceOpen" aria-controls="experience-job-menu" (click)="experienceOpen = !experienceOpen"><span class="category-group-name"><i class="bi bi-people" aria-hidden="true"></i>Fresher &amp; experienced jobs</span><i class="bi category-expand-icon" [ngClass]="experienceOpen ? 'bi-dash-lg' : 'bi-plus-lg'" aria-hidden="true"></i></button>
      <div id="experience-job-menu" class="category-submenu" *ngIf="experienceOpen">
        <a *ngFor="let category of privateExperienceFilters" [routerLink]="['/', categoryRoutePrefix, category.slug]" (click)="closeMenus()">{{ category.label }}</a>
      </div>
      <a [routerLink]="['/', categoryRoutePrefix, 'walk-ins']" (click)="closeMenus()"><span class="category-group-name"><i class="bi bi-briefcase" aria-hidden="true"></i>All walk-in jobs</span><i class="bi bi-chevron-right" aria-hidden="true"></i></a>
      <a routerLink="/official-career-links" (click)="closeMenus()"><span class="category-group-name"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>Official Career Links</span><i class="bi bi-chevron-right" aria-hidden="true"></i></a>
    </nav>
  </aside>
</header>
