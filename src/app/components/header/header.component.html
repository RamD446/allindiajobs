<header class="site-header">
  <div class="site-header-main">
    <div class="header-brand-group">
      <button class="header-icon-button" type="button" (click)="toggleCategories()" aria-label="Browse job categories" [attr.aria-expanded]="categoriesOpen">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <a class="brand" routerLink="/" aria-label="Freejob Information home">
        <span class="brand-wordmark"><strong>Freejob</strong><small>Information</small></span>
      </a>
    </div>
    <div class="header-actions">
      <button class="header-icon-button" type="button" (click)="toggleSearch()" aria-label="Search jobs" [attr.aria-expanded]="searchOpen">
        <i class="bi" [ngClass]="searchOpen ? 'bi-x-lg' : 'bi-search'" aria-hidden="true"></i>
      </button>
      <a *ngIf="!authLoading" class="header-login-link" routerLink="/login">
        <i class="bi" [ngClass]="isSignedIn ? 'bi-briefcase' : 'bi-box-arrow-in-right'" aria-hidden="true"></i>
        <span>{{ isSignedIn ? 'Manage jobs' : 'Login' }}</span>
      </a>
    </div>
  </div>

  <form *ngIf="searchOpen" class="header-search-panel" (ngSubmit)="submitSearch()">
    <label class="visually-hidden" for="header-job-search">Search jobs and companies</label>
    <input id="header-job-search" type="search" name="q" [(ngModel)]="searchQuery" placeholder="Search jobs or companies" autofocus>
    <button type="submit" aria-label="Submit search"><i class="bi bi-search" aria-hidden="true"></i></button>
  </form>

  <button *ngIf="categoriesOpen" class="category-drawer-overlay" type="button" aria-label="Close categories" (click)="closeMenus()"></button>
  <aside class="category-drawer" [class.open]="categoriesOpen" [attr.aria-hidden]="!categoriesOpen">
    <div class="category-drawer-header"><strong>Browse jobs</strong><button class="header-icon-button" type="button" (click)="closeMenus()" aria-label="Close categories"><i class="bi bi-x-lg"></i></button></div>
    <nav aria-label="Browse jobs and links">
      <a *ngFor="let category of categories" [routerLink]="['/']" [queryParams]="{category: category.slug}" (click)="closeMenus()">
        <span>{{ category.label }}</span><i class="bi bi-chevron-right" aria-hidden="true"></i>
      </a>
      <a routerLink="/official-career-links" (click)="closeMenus()"><span>Official Career Links</span><i class="bi bi-chevron-right" aria-hidden="true"></i></a>
    </nav>
  </aside>
</header>
