<div class="">
  <div *ngIf="isLoading" class="finding-jobs-loader">
    <div class="loader-icon-wrap">
      <i class="bi bi-briefcase-fill loader-briefcase"></i>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <p class="loader-title">Finding Jobs<span class="loader-ellipsis">...</span></p>
    <p class="loader-sub">Please wait while we load the latest opportunities</p>
  </div>

 

    <div class="row gx-2 gy-2 home-grid-row home-main-row">
      <div class="d-none d-lg-block col-lg-1"></div>

      <div class="col-12 col-lg-10">
        <div class="jobs-section">
          <div class="section-header">{{ getLatestJobsHeading() }}</div>

          <div *ngIf="hasNoData()" class="no-data-small card p-2 mb-3">
            <div class="d-flex flex-column align-items-center justify-content-center text-center gap-2">
              <div>
                <h6 class="no-data-small-title mb-1">Currently Not Available</h6>
                <div class="no-data-small-message small text-muted">The job you are looking for may be expired or no jobs match the selected filter.</div>
              </div>
            </div>
          </div>
           <div *ngIf="!isLoading" class="container-fluid">
    <div class="row gx-2 gy-2 home-grid-row home-top-filters-row">
      <div class="col-12">
        <div class="home-top-filters-card">
          <div class="jc-pills-row">
            <button
              type="button"
              *ngFor="let category of getAllCategoryFilters()"
              class="jc-pill"
              [class.jc-pill-active]="selectedJobCategory === category"
              (click)="selectCategoryTab(category)">
              <span>{{ getCategoryDisplayLabel(category) }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

          <div class="home-jobs-table-wrap" *ngIf="!hasNoData()">
            <table class="home-jobs-table">
              <thead>
                <tr>
                  <th>Posted</th>
                  <th>Title</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let job of getPaginatedJobsForHome()">
                  <td class="home-jobs-table-date" [title]="job.createdDate">
                    {{ job.createdDate | date:'dd/MM/yyyy' }}
                  </td>
                  <td class="home-jobs-table-title-cell">
                    <div class="home-jobs-table-title" (click)="viewJobDetails(job)">{{ job.title }}</div>
                  </td>
                  <td class="home-jobs-table-action">
                    <div class="home-jobs-table-actions">
                      <button class="job-icon-btn view-btn" type="button" (click)="viewJobDetails(job)" title="View this job">
                        <i class="bi bi-eye"></i>
                      </button>
                      <button class="job-icon-btn share-btn" type="button" (click)="shareJob(job)" title="Share this job">
                        <i class="bi bi-share"></i>
                      </button>
                      <button *ngIf="isLoggedIn" class="job-icon-btn edit-btn" type="button" (click)="editJob(job)" title="Edit this job">
                        <i class="bi bi-pencil"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="home-pagination-wrap mt-2" *ngIf="getFilteredJobsForHome().length > pageSize">
            <div class="home-pagination">
              <button type="button" class="page-btn" (click)="prevPage()" [disabled]="currentPage===1">Prev</button>
              <button
                *ngFor="let p of getVisiblePageNumbers()"
                type="button"
                class="page-number"
                [class.active]="p===currentPage"
                (click)="goToPage(p)">
                {{ p }}
              </button>
              <button type="button" class="page-btn" (click)="nextPage()" [disabled]="currentPage===totalPages">Next</button>
            </div>
          </div>

        </div>
      </div>

      <div class="d-none d-lg-block col-lg-1"></div>
    </div>
  </div>
</div>
