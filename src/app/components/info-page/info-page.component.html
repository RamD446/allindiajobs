<div class="info-page-bg">
  <div class="container info-body">
    <div class="info-card">
      <!-- Card Header -->
      <div class="info-card-header">
        <i class="bi" [ngClass]="pageIcon" [style.color]="pageIconColor"></i>
        <div class="info-card-heading">
          <h2 class="info-card-title">{{ title }}</h2>
          <p class="info-card-subtitle">{{ subtitle }}</p>
        </div>
      </div>
      <!-- Card Content -->
      <div class="info-content" [innerHTML]="sanitizedContent"></div>
    </div>
  </div>
</div>
