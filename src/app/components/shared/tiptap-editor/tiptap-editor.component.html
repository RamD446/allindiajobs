<div class="tiptap-shell">
  <div class="tiptap-toolbar">
    <button
      type="button"
      class="toolbar-btn"
      [class.active]="isBoldActive()"
      (mousedown)="$event.preventDefault()"
      (click)="toggleBold()"
      aria-label="Bold">
      <strong>B</strong>
    </button>

    <button
      type="button"
      class="toolbar-btn"
      [class.active]="isBulletListActive()"
      (mousedown)="$event.preventDefault()"
      (click)="toggleBulletList()"
      aria-label="Bullet list">
      <i class="bi bi-list-ul"></i>
    </button>

    <button
      type="button"
      class="toolbar-btn"
      (mousedown)="$event.preventDefault()"
      (click)="clearFormatting()"
      aria-label="Clear formatting">
      Clear
    </button>
  </div>

  <div #editorHost class="tiptap-editor" role="textbox" aria-multiline="true"></div>
</div>
